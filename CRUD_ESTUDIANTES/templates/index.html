<!DOCTYPE html>
<html>
<head>
    <title>CRUD Estudiantes</title>
</head>
<body>

<h1>GESTIÓN DE ESTUDIANTES</h1>

<a href="/crear">Registrar estudiante</a>

<table border="1" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Nombre</th>
    <th>Apellido</th>
    <th>Correo</th>
    <th>Programa</th>
    <th>Acciones</th>
</tr>

{% for e in estudiantes %}
<tr>
    <td>{{ e.id }}</td>
    <td>{{ e.nombre }}</td>
    <td>{{ e.apellido }}</td>
    <td>{{ e.correo }}</td>
    <td>{{ e.programa }}</td>

    <td>
        <a href="/editar/{{ e.id }}">Editar</a>

        <a href="/eliminar/{{ e.id }}"
           onclick="return confirm('¿Desea eliminar?')">
           Eliminar
        </a>
    </td>
</tr>
{% endfor %}

</table>

</body>
</html>
